name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src

      - name: Install eBPF linker
        run: |
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst \
            | tar --zstd -xf - -C "$HOME/.cargo/bin" bpf-linker
          bpf-linker --version

      - name: Check formatting
        working-directory: fire-su-v3/backend/fire-su
        run: cargo fmt --all -- --check

      - name: Check shared crate
        working-directory: fire-su-v3/backend/fire-su
        run: cargo check -p fire-su-common

      - name: Check daemon crate
        working-directory: fire-su-v3/backend/fire-su
        run: cargo check -p fire-su

      - name: Run tests
        working-directory: fire-su-v3/backend/fire-su
        run: cargo test -p fire-su

      - name: Validate module package
        run: |
          ./package-release.sh
          unzip -t fire-su.zip
