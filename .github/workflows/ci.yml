name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src

      - name: Install eBPF linker
        run: cargo install bpf-linker --locked

      - name: Check formatting
        working-directory: fire-su-v3/backend/fire-su
        run: cargo fmt --all -- --check

      - name: Check shared crate
        working-directory: fire-su-v3/backend/fire-su
        run: cargo check -p fire-su-common

      - name: Check daemon crate
        working-directory: fire-su-v3/backend/fire-su
        run: cargo check -p fire-su

      - name: Validate module package
        run: |
          ./package-release.sh
          unzip -t fire-su.zip
